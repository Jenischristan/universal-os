name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Unit tests (parsers, forge, kb, diff)
        run: pytest -q tests
      - name: CLI smoke — every group answers --help
        run: |
          for g in iso vm re forge test kb env mcp; do
            python -m universal_os.cli $g --help > /dev/null
          done
          python -m universal_os.cli --version
      - name: MCP stdio handshake
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 15 python -m universal_os.mcp_server \
            | python -c "import sys,json; msgs=[json.loads(l) for l in sys.stdin if l.strip()]; \
            assert any(m.get('id')==2 and len(m['result']['tools'])>=30 for m in msgs), 'tools/list failed'; print('MCP OK')"
      - name: Knowledge base lint
        run: python -m universal_os.cli kb index
      - name: Wheel packaging — knowledge/, prompts/, skills/ must ship
        run: |
          pip wheel . --no-deps -w dist -q
          python - << 'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")
          assert whl, "no wheel built"
          names = zipfile.ZipFile(whl[0]).namelist()
          required = ["universal_os/_data/knowledge/INDEX.md",
                      "universal_os/_data/prompts/00-start-here.md",
                      "universal_os/_data/skills/build-any-os/SKILL.md"]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is missing packaged data: {missing}")
          print(f"wheel OK ({len(names)} files, _data present)")
          PY
      - name: Guardrails self-check — repo must be free of red-flag artifacts
        run: |
          python - << 'PY'
          from pathlib import Path
          import re, sys
          banned = [r"(?i)\.(iso|wim|esd)$", r"(?i)ntoskrnl\.(exe|dll)$", r"(?i)regdump|hive_dump"]
          hits = [str(p) for p in Path(".").rglob("*") if p.is_file()
                  and any(re.search(b, p.name) for b in banned)]
          if hits:
              sys.exit(f"red-flag files in repo: {hits}")
          print("clean")
          PY
