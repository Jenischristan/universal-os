[project]
name = "universal-os"
version = "0.2.1"
description = "Tools, an MCP server, skills and a shared knowledge base that let an AI coding agent reverse engineer a Windows ISO in a sandbox VM and rebuild the OS ReactOS-style, component by component, until its apps run on the rebuild."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "reactos", "reverse-engineering", "operating-system", "windows", "ai-agents", "clean-room", "qemu"]
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6",
]

[project.scripts]
uos = "universal_os.cli:main"
uos-mcp = "universal_os.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["universal_os"]

# Ship the agent-facing data with the wheel so `uv tool install` / `uvx` get the
# knowledge base, phase prompts and skills — not just the Python package.
[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "universal_os/_data/knowledge"
"prompts" = "universal_os/_data/prompts"
"skills" = "universal_os/_data/skills"
"examples" = "universal_os/_data/examples"
"RULES.md" = "universal_os/_data/RULES.md"
"SKILL.md" = "universal_os/_data/SKILL.md"
