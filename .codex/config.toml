# Codex CLI — universal-os MCP server
# Self-contained: uvx resolves the package from GitHub, no manual install needed.
# After `uv tool install git+https://github.com/Jenischristan/universal-os`
# you can switch to the faster direct form:  command = "uos-mcp"
[mcp_servers."universal-os"]
command = "uvx"
args = ["--from", "git+https://github.com/Jenischristan/universal-os", "uos-mcp"]
env = { "UOS_HOME" = "~/.universal-os" }
